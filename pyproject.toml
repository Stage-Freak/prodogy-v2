[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prodogy"
version = "0.2.0"
description = "Intelligent deployment-readiness linter and production-readiness coach for CI/CD pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Prodogy" }]
keywords = ["devops", "kubernetes", "docker", "linter", "ci-cd", "production-readiness"]

dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
    "pydantic>=2.6",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
llm = [
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
prodogy = "prodogy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prodogy.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
