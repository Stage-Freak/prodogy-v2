name: 'Prodogy Scan'
description: 'Scan deployment configs for production-readiness issues and gate your CI pipeline.'
author: 'Prodogy'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  fail-on:
    description: 'Minimum severity that fails the build (critical, error, warning, info).'
    required: false
    default: 'error'
  changed:
    description: 'File containing changed paths (one per line) — scans only those files.'
    required: false
    default: ''
  config:
    description: 'Path to a .prodogy.yml config file.'
    required: false
    default: ''
  baseline:
    description: 'Baseline file to suppress pre-existing findings.'
    required: false
    default: ''
  version:
    description: 'Prodogy version (e.g. v0.2.0). Defaults to latest from source.'
    required: false
    default: ''
  post-pr-comment:
    description: 'Post a PR comment with findings summary.'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for posting PR comments.'
    required: false
    default: ''
  enrich:
    description: 'Enrich findings with LLM-generated contextual explanations.'
    required: false
    default: 'false'
  llm-api-key:
    description: 'API key for the LLM provider (used with enrich).'
    required: false
    default: ''
  llm-provider-url:
    description: 'LLM provider base URL (default: https://api.openai.com/v1).'
    required: false
    default: ''
  llm-model:
    description: 'LLM model name (default: gpt-4o-mini).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Prodogy
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          V="${{ inputs.version }}"
          pip install "prodogy[dev,llm]==${V#v}" 2>/dev/null || \
          pip install "prodogy[dev,llm] @ https://github.com/${ACTION_REPO}/releases/download/${V}/prodogy-${V#v}-py3-none-any.whl" 2>/dev/null || \
          pip install "prodogy[dev,llm] @ https://github.com/${ACTION_REPO}/archive/refs/tags/${V}.tar.gz"
        else
          pip install "prodogy[dev,llm] @ https://github.com/${ACTION_REPO}/archive/refs/heads/${ACTION_REF}.tar.gz"
        fi
        echo "Prodogy $(prodogy --version) installed"

    - name: Collect changed files
      shell: bash
      if: inputs.changed == ''
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          git diff --name-only "origin/${{ github.base_ref }}"... > /tmp/prodogy-changed-raw.txt
          rm -f /tmp/prodogy-changed.txt
          while IFS= read -r f; do
            echo "$GITHUB_WORKSPACE/$f" >> /tmp/prodogy-changed.txt
          done < /tmp/prodogy-changed-raw.txt
          echo "Changed files:"
          cat /tmp/prodogy-changed.txt
        fi

    - name: Run Prodogy scan
      shell: bash
      continue-on-error: true
      env:
        PRODOGY_LLM_API_KEY: ${{ inputs.llm-api-key }}
        PRODOGY_LLM_PROVIDER_URL: ${{ inputs.llm-provider-url }}
        PRODOGY_LLM_MODEL: ${{ inputs.llm-model }}
      run: |
        ARGS=""
        [ -f /tmp/prodogy-changed.txt ] && ARGS="$ARGS --changed /tmp/prodogy-changed.txt"
        [ -n "${{ inputs.changed }}" ] && ARGS="$ARGS --changed ${{ inputs.changed }}"
        [ -n "${{ inputs.config }}" ] && ARGS="$ARGS --config ${{ inputs.config }}"
        [ -n "${{ inputs.baseline }}" ] && ARGS="$ARGS --baseline ${{ inputs.baseline }}"
        [ "${{ inputs.enrich }}" = "true" ] && ARGS="$ARGS --enrich"

        prodogy scan . $ARGS --fail-on ${{ inputs.fail-on }} -f json -o /tmp/prodogy-report.json || true

    - name: Debug enrich status
      shell: bash
      if: inputs.enrich == 'true'
      run: |
        python3 -c "
import json
try:
    r = json.load(open('/tmp/prodogy-report.json'))
    findings = [f for f in r.get('findings', []) if not f.get('suppressed')]
    enriched = [f for f in findings if f.get('llm_explanation')]
    print(f'Total active findings: {len(findings)}')
    print(f'Enriched findings: {len(enriched)}')
    if enriched:
        for f in enriched:
            print(f'  {f[\"rule_id\"]}: llm_explanation present ({len(f[\"llm_explanation\"])} chars)')
    elif findings:
        # Check env vars
        import os
        key = os.environ.get('PRODOGY_LLM_API_KEY', '')
        url = os.environ.get('PRODOGY_LLM_PROVIDER_URL', '')
        model = os.environ.get('PRODOGY_LLM_MODEL', '')
        print(f'KEY set: {bool(key)}, URL: {url}, Model: {model}')
        if not key:
            print('WARNING: PRODOGY_LLM_API_KEY is empty!')
        # First finding details
        f = findings[0]
        print(f'Sample finding keys: {list(f.keys())}')
        print(f'Has llm_explanation key: {\"llm_explanation\" in f}')
except Exception as e:
    print(f'Debug error: {e}')
"

    - name: Post PR comment
      if: github.event_name == 'pull_request' && inputs.post-pr-comment == 'true' && inputs.github-token != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          let report;
          try { report = JSON.parse(fs.readFileSync('/tmp/prodogy-report.json','utf8')); }
          catch (e) { console.log('No report'); return; }
          const findings = (report.findings || []).filter(f => !f.suppressed);
          if (findings.length === 0) { console.log('Clean'); return; }
          const sev = { critical:'🛑', error:'❌', warning:'⚠️', info:'ℹ️' };
          const order = { critical:4, error:3, warning:2, info:1 };
          const sorted = findings.sort((a,b) => (order[b.severity]||0)-(order[a.severity]||0));
          const counts = {};
          for (const f of sorted) counts[f.severity] = (counts[f.severity]||0)+1;
          let body = '## 🚀 Prodogy — Deployment Readiness Report\n\n';
          body += `Scanned **${report.summary.scanned_files}** file(s) — `;
          body += `🛑 ${counts.critical||0} critical, ❌ ${counts.error||0} error, ⚠️ ${counts.warning||0} warning, ℹ️ ${counts.info||0} info.\n\n`;
          const blocking = sorted.filter(f => order[f.severity] >= 3);
          body += blocking.length
            ? `> ⚠️ **${blocking.length} finding(s) at or above 'error'** — gate **FAILS**.\n\n`
            : '> ✅ No findings at or above `error` — gate **passes**.\n\n';
          body += '<details><summary>Findings</summary>\n\n| Severity | Rule | File | Issue |\n|---|---|---|---|\n';
          for (const f of sorted) {
            const loc = f.location.line ? `${f.location.path}:${f.location.line}` : f.location.path;
            body += `| ${sev[f.severity]||''} ${f.severity} | \`${f.rule_id}\` | \`${loc}\` | ${f.message.replace(/\|/g,'\\|')} |\n`;
          }
          body += '\n</details>\n\n';
          body += '<details><summary>Why these matter & how to fix</summary>\n\n';
          for (const f of sorted) {
            body += `**${f.rule_id} — ${f.title}** (\`${f.location.path}:${f.location.line||''}\`)\n`;
            if (f.rationale) body += `- _Why:_ ${f.rationale}\n`;
            if (f.remediation) body += `- _Fix:_ ${f.remediation}\n`;
            if (f.llm_explanation) body += `- _LLM:_ ${f.llm_explanation}\n`;
            body += '\n';
          }
          body += '</details>\n\n_Powered by [Prodogy](https://github.com/Stage-Freak/prodogy-v2)._';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes('Prodogy — Deployment Readiness'));
          if (existing) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
          }

    - name: Gate
      shell: bash
      run: |
        if [ ! -f /tmp/prodogy-report.json ]; then
          echo "::notice::No scan report - gate skipped."
          exit 0
        fi
        SCRIPT="import json, sys; r=json.load(open('/tmp/prodogy-report.json')); o={'critical':4,'error':3,'warning':2,'info':1}; t=o.get('${{ inputs.fail-on }}',3); print(sum(1 for f in r.get('findings',[]) if not f.get('suppressed') and o.get(f.get('severity'),0) >= t))"
        BLOCKING=$(python3 -c "$SCRIPT")
        if [ "$BLOCKING" -gt 0 ]; then
          echo "::error::Prodogy gate FAILED - $BLOCKING finding(s) at or above '${{ inputs.fail-on }}' threshold."
          exit 1
        else
          echo "::notice::Prodogy gate PASSED - no blocking findings."
        fi
