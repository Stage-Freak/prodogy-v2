name: 'Prodogy Scan'
description: 'Scan deployment configs for production-readiness issues and gate your CI pipeline.'
author: 'Prodogy'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  fail-on:
    description: 'Minimum severity that fails the build (critical, error, warning, info).'
    required: false
    default: 'error'
  changed:
    description: 'File containing changed paths (one per line) — scans only those files.'
    required: false
    default: ''
  format:
    description: 'Output format (terminal, json, markdown, sarif, compliance).'
    required: false
    default: 'terminal'
  output:
    description: 'Path to write the report file.'
    required: false
    default: ''
  config:
    description: 'Path to a .prodogy.yml config file.'
    required: false
    default: ''
  baseline:
    description: 'Baseline file to suppress pre-existing findings.'
    required: false
    default: ''
  version:
    description: 'Prodogy version (e.g. v0.2.0). Defaults to latest from PyPI.'
    required: false
    default: ''

outputs:
  exit_code:
    description: 'Exit code from the scan (0 = pass, 1 = fail).'
    value: ${{ steps.scan.outputs.exit_code }}
  report_path:
    description: 'Path to the generated report file.'
    value: ${{ steps.scan.outputs.report_path }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Prodogy
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          V="${{ inputs.version }}"
          pip install "prodogy[dev,llm]==${V#v}" 2>/dev/null || \
          pip install "prodogy[dev,llm] @ https://github.com/${ACTION_REPO}/releases/download/${V}/prodogy-${V#v}-py3-none-any.whl" 2>/dev/null || \
          pip install "prodogy[dev,llm] @ https://github.com/${ACTION_REPO}/archive/refs/tags/${V}.tar.gz"
        else
          pip install "prodogy[dev,llm] @ https://github.com/${ACTION_REPO}/archive/refs/heads/${ACTION_REF}.tar.gz"
        fi
        echo "Prodogy $(prodogy --version) installed"

    - name: Collect changed files
      shell: bash
      if: inputs.changed == ''
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          git diff --name-only "origin/${{ github.base_ref }}"... > /tmp/prodogy-changed-raw.txt
          # Prefix with GITHUB_WORKSPACE so --changed gets absolute paths
          rm -f /tmp/prodogy-changed.txt
          while IFS= read -r f; do
            echo "$GITHUB_WORKSPACE/$f" >> /tmp/prodogy-changed.txt
          done < /tmp/prodogy-changed-raw.txt
          echo "Changed files:"
          cat /tmp/prodogy-changed.txt
        fi

    - name: Run Prodogy scan
      id: scan
      shell: bash
      continue-on-error: true
      run: |
        ARGS=""
        if [ -f /tmp/prodogy-changed.txt ]; then
          ARGS="$ARGS --changed /tmp/prodogy-changed.txt"
        elif [ -n "${{ inputs.changed }}" ]; then
          ARGS="$ARGS --changed ${{ inputs.changed }}"
        fi
        [ -n "${{ inputs.output }}" ] && ARGS="$ARGS -o ${{ inputs.output }} -f ${{ inputs.format }}"
        [ -n "${{ inputs.config }}" ] && ARGS="$ARGS --config ${{ inputs.config }}"
        [ -n "${{ inputs.baseline }}" ] && ARGS="$ARGS --baseline ${{ inputs.baseline }}"

        prodogy scan . $ARGS --fail-on ${{ inputs.fail-on }}
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        echo "report_path=${{ inputs.output }}" >> "$GITHUB_OUTPUT"

    - name: Gate — fail build on blocking findings
      shell: bash
      if: steps.scan.outputs.exit_code != '0'
      run: |
        echo "::error::Prodogy gate FAILED — findings at or above '${{ inputs.fail-on }}' threshold."
        exit 1
