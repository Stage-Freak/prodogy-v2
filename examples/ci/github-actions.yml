name: Prodogy Deployment Readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  prodogy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One-line Prodogy scan — installs, detects changed files, scans,
      # optionally posts a PR comment, and gates the build.
      - uses: Stage-Freak/prodogy-v2@main
        with:
          fail-on: error
          post-pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Optional: upload SARIF for GitHub Code Scanning alerts.
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/prodogy-report.json
        continue-on-error: true
