name: Prodogy Deployment Readiness

on:
  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '**Dockerfile*'
      - '**.tf'
      - '**.env*'
      - '**docker-compose*'
      - '**prometheus*'
      - '**grafana*'
      - '**playbook*'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  prodogy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One-line Prodogy scan — installs, scans, and gates the build.
      - uses: your-org/prodogy@v0.2.0
        with:
          fail-on: error

      # Upload SARIF for GitHub Code Scanning alerts.
      - name: Upload SARIF
        if: always() && hashFiles('prodogy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prodogy.sarif
        continue-on-error: true

      # Post a PR comment with findings.
      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('prodogy.json', 'utf8'));
            } catch (e) {
              console.log('No scan report');
              return;
            }
            const findings = (report.findings || []).filter(f => !f.suppressed);
            if (findings.length === 0) { console.log('No findings'); return; }

            const sevEmoji = { critical: '🛑', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const sevOrder = { critical: 4, error: 3, warning: 2, info: 1 };
            const sorted = findings.sort((a, b) => (sevOrder[b.severity] || 0) - (sevOrder[a.severity] || 0));
            const bySev = {};
            for (const f of sorted) bySev[f.severity] = (bySev[f.severity] || 0) + 1;

            let body = '## 🚀 Prodogy — Deployment Readiness Report\n\n';
            body += `Scanned **${report.summary.scanned_files}** file(s) — 🛑 ${bySev.critical || 0} critical, ❌ ${bySev.error || 0} error, ⚠️ ${bySev.warning || 0} warning, ℹ️ ${bySev.info || 0} info.\n\n`;
            const blocking = sorted.filter(f => sevOrder[f.severity] >= 3);
            body += blocking.length
              ? `> ⚠️ **${blocking.length} finding(s) at or above 'error'** — gate **FAILS**.\n\n`
              : '> ✅ No findings at or above `error` — gate **passes**.\n\n';

            body += '<details><summary>View all findings</summary>\n\n| Severity | Rule | Location | Issue |\n|---|---|---|---|\n';
            for (const f of sorted) {
              const loc = f.location.line ? `${f.location.path}:${f.location.line}` : f.location.path;
              body += `| ${sevEmoji[f.severity] || ''} ${f.severity} | \`${f.rule_id}\` | \`${loc}\` | ${f.message.replace(/\|/g, '\\|')} |\n`;
            }
            body += '\n</details>\n\n<details><summary>Why these matter & how to fix</summary>\n\n';
            for (const f of sorted) {
              body += `**${f.rule_id} — ${f.title}** (\`${f.location.path}:${f.location.line || ''}\`)\n`;
              if (f.rationale) body += `- _Why:_ ${f.rationale}\n`;
              if (f.remediation) body += `- _Fix:_ ${f.remediation}\n`;
              body += '\n';
            }
            body += '</details>\n\n_Report generated by [Prodogy](https://github.com/your-org/prodogy)._\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Prodogy — Deployment Readiness'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
